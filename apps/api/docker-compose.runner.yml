services:
  runner:
    image: judge0/judge0:1.13.1
    container_name: learnhub-code-runner
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - runner-db
      - runner-redis

  runner-worker:
    image: judge0/judge0:1.13.1
    container_name: learnhub-code-runner-worker
    command: ["./scripts/workers"]
    restart: unless-stopped
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - runner-db
      - runner-redis

  runner-db:
    image: postgres:16.2
    container_name: learnhub-code-runner-db
    restart: unless-stopped
    env_file: judge0.conf
    volumes:
      - runner-data:/var/lib/postgresql/data

  runner-redis:
    image: redis:7.2.4
    container_name: learnhub-code-runner-redis
    restart: unless-stopped
    env_file: judge0.conf
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""]

volumes:
  runner-data:
