services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: learnhub-code-runner:local
    restart: unless-stopped
    privileged: true
    shm_size: 256m
    ports:
      - "127.0.0.1:5050:5050"
    command: ["-release", "-parallelism", "1", "-auth-token", "${CODE_RUNNER_TOKEN:?set CODE_RUNNER_TOKEN in .env}"]
